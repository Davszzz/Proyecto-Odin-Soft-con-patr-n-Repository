{% extends "base.html" %}

{% block title %}
Crear cuenta | Odin Soft
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="card odin-card">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <img
                        src="{{ url_for('static', filename='img/odinsoft-logo.png') }}"
                        alt="Odin Soft"
                        class="auth-logo"
                    >

                </div>


                <form method="POST">

                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label
                            for="full_name"
                            class="form-label"
                        >
                            Nombre completo
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                id="full_name"
                                name="full_name"
                                class="form-control"
                                placeholder="Nombre y apellidos"
                                autocomplete="name"
                                required
                            >

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Correo electrónico
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="correo@ejemplo.com"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- TELÉFONO -->

                    <div class="mb-3">

                        <label
                            for="phone"
                            class="form-label"
                        >
                            Teléfono
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-telephone"></i>
                            </span>

                            <input
                                type="text"
                                id="phone"
                                name="phone"
                                class="form-control"
                                placeholder="999 999 999"
                                autocomplete="tel"
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-4">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text bg-white">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Mínimo 6 caracteres"
                                minlength="6"
                                autocomplete="new-password"
                                required
                            >

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-odin w-100"
                    >
                        <i class="bi bi-person-plus me-1"></i>
                        Crear cuenta
                    </button>

                </form>


                <div class="text-center mt-4">

                    <span class="text-muted">
                        ¿Ya tiene una cuenta?
                    </span>

                    <a
                        href="{{ url_for('auth.login') }}"
                        class="text-decoration-none fw-semibold ms-1"
                    >
                        Iniciar sesión
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
